# Corsa Auto Detailing — first Google Search campaign.
# Single source of truth for `python -m corsa_ads`. Validate after every edit:
#   python -m corsa_ads validate-config
# Prices and claims here must match src/config/business.ts (pricingVersion 2026-10-v14).

site: https://corsaautodetailing.com

campaign:
  name: "Corsa | Search | Clay County | Launch Oct 2026"
  # Always created PAUSED. The CLI refuses any other value; enabling is a manual step for the owner.
  status: PAUSED
  daily_budget_usd: 10.00
  budget_name: "Corsa | Clay County | Daily budget"
  bidding:
    strategy: MAXIMIZE_CLICKS
    # Optional ceiling per click (USD). null = let Google bid within the budget.
    max_cpc_usd: 7.00
  networks:
    google_search: true
    search_partners: false
    display: false
  # The campaign declares it has no EU political advertising (required field on create).
  eu_political_advertising: false
  # null = no start date set; ads can run as soon as the owner enables the campaign.
  start_date: null
  # Account time zone must be America/New_York (checked by auth-check / preview); the schedule uses it.
  expected_time_zone: America/New_York
  locations:
    # Official Google Ads geo target constants (geotargets-2026-08-12.csv). Cities only; no broader fallback.
    - { id: 1015119, name: "Middleburg, Florida, United States", type: City }
    - { id: 1015041, name: "Green Cove Springs, Florida, United States", type: City }
    - { id: 9196545, name: "Fleming Island, Florida, United States", type: City }
    # Added 2026-10-19: St. Johns County core areas from the site. 32092 = World Golf Village's ZIP.
    - { id: 9197497, name: "Saint Johns, Florida, United States", type: City }
    - { id: 9011488, name: "32092, Florida, United States", type: Postal Code }
  # PRESENCE = people in or regularly in these towns (not people merely searching about them).
  location_matching: PRESENCE
  languages:
    - { id: 1000, name: English }
  # Ad schedule in the account time zone. Owner to confirm hours and days before enabling.
  schedule:
    days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    start: "08:00"
    end: "19:00"

# Campaign-level negatives. Broad negatives block queries containing every word in any order,
# but NOT plurals, misspellings or synonyms, so common variants are listed separately.
negative_keywords:
  - { text: job, match: BROAD }
  - { text: jobs, match: BROAD }
  - { text: hiring, match: BROAD }        # variant added for the job-seeker intent
  - { text: salary, match: BROAD }
  - { text: training, match: BROAD }
  - { text: course, match: BROAD }
  - { text: courses, match: BROAD }
  - { text: how to, match: PHRASE }
  - { text: diy, match: BROAD }
  - { text: supplies, match: BROAD }
  - { text: equipment, match: BROAD }
  - { text: wholesale, match: BROAD }
  - { text: automatic car wash, match: PHRASE }
  - { text: self service, match: PHRASE }
  - { text: self serve, match: PHRASE }  # variant
  - { text: car wash tunnel, match: PHRASE }
  - { text: tunnel car wash, match: PHRASE }  # word-order variant
  # Added 2026-10-05 with the broader keywords below: vehicles and shopping intents we don't serve.
  - { text: boat, match: BROAD }
  - { text: boats, match: BROAD }
  - { text: motorcycle, match: BROAD }
  - { text: kit, match: BROAD }
  - { text: kits, match: BROAD }
  - { text: products, match: BROAD }
  # Added 2026-10-12: services Corsa doesn't offer yet (business.futureServices); "ppf" and "ceramic" searches had matched.
  - { text: ppf, match: BROAD }
  - { text: paint protection film, match: PHRASE }
  - { text: ceramic, match: BROAD }
  - { text: tint, match: BROAD }
  - { text: tinting, match: BROAD }
  - { text: paint correction, match: PHRASE }

ad_groups:
  - name: Mobile Detailing
    final_url: /book
    keywords:
      - { text: mobile detailing near me, match: PHRASE }
      - { text: mobile car detailing, match: PHRASE }
      - { text: mobile auto detailing, match: PHRASE }
      - { text: mobile detailing middleburg, match: PHRASE }
      - { text: mobile detailing green cove springs, match: PHRASE }
      - { text: mobile detailing fleming island, match: PHRASE }
      - { text: mobile auto detailing near me, match: EXACT }
      # 2026-10-05: no impressions in the first 3 days. Most local searches don't say "mobile" or a town name.
      - { text: car detailing near me, match: PHRASE }
      - { text: auto detailing near me, match: PHRASE }
      - { text: detailing near me, match: PHRASE }
    ad:
      path1: Mobile
      path2: Detailing
      # 2026-10-19: Google rated ad relevance below average on the "near me" keywords, so four headlines
      # now carry the search words (were Clay County Mobile Detailing, Mobile Auto Detailing,
      # Premium Mobile Car Care, Detailing at Home or Work).
      headlines:
        - Mobile Detailing Near You
        - We Come to You
        - Detailing From $90
        - Veteran-Owned Detailing
        - Book Your Detail Online
        - No Water or Power Needed
        - Middleburg Mobile Detailing
        - Fleming Island Detailing
        - Green Cove Springs Detailing
        - Full Detail From $150
        - Interior & Exterior Detailing
        - Mobile Auto Detailing Near You
        - Se Habla Español
        - Mobile Car Detailing
        - Car Detailing Near You
      descriptions:
        - Mobile car detailing at your home or work in Clay County and northern St. Johns County.
        - Basic, Essential and Signature packages, inside and out in one visit. From $90.
        - Veteran-owned mobile auto detailing. We need no water or power hookup from you.
        - Car detailing near you. Pick a date online and we confirm by email.

  - name: Interior & Exterior Detailing
    final_url: /book
    keywords:
      - { text: interior car detailing, match: PHRASE }
      - { text: interior and exterior detailing, match: PHRASE }
      - { text: car detailing middleburg, match: PHRASE }
      - { text: car detailing green cove springs, match: PHRASE }
      - { text: car detailing fleming island, match: PHRASE }
      - { text: car detailing, match: PHRASE }
      - { text: auto detailing, match: PHRASE }
    ad:
      path1: Detailing
      path2: Packages
      headlines:
        - Interior Car Detailing
        - Interior & Exterior Detailing
        - Wash & Clean-Up From $90
        - Signature Detail From $200
        - Full Detail From $150
        - Clay Bar & Protectant Wax
        - Exterior Wash With Sealant
        - Interior Deep Clean
        - Car Detailing in Middleburg
        - Fleming Island Car Detailing
        - Green Cove Springs Detailing
        - Mobile Service, We Come to You
        - Veteran-Owned Detailing
        - Book Your Detail Online
        - No Water or Power Needed
      descriptions:
        # 2026-10-19: descriptions 1 and 4 now name the keywords (car / auto / interior car detailing).
        - Car detailing inside and out, at your home or work. Interior car detailing from $90.
        - Signature adds clay bar, sanitation, interior deep clean and a 1 month protectant wax.
        - Exterior hand wash, sealant application, wheels cleaned, tire shine and windows.
        - Veteran-owned mobile auto detailing. Pick a date online; we confirm by email.

assets:
  callouts:
    - Mobile Service
    - Online Booking
    - Veteran-Owned
    - No Water or Power Needed
    - Home or Work Visits
    - Se Habla Español
  sitelinks:
    - { text: "Book a Detail", url: /book, line1: "Pick a date that works for you", line2: "We confirm your time by email" }
    - { text: "Packages & Prices", url: /services, line1: "Basic, Essential and Signature", line2: "Inside and out in one visit" }
    - { text: "Service Areas", url: /service-areas, line1: "Middleburg and Fleming Island", line2: "Green Cove Springs and nearby" }
    - { text: "Contact Us", url: /contact, line1: "Questions before you book?", line2: "Send us a message" }
    # Added 2026-10-12. Must match business.firstTimeOffer (percent and terms); the link ticks the offer on the booking form.
    - { text: "10% Off First Detail", url: "/book?offer=first-time", line1: "First-time customers only", line2: "Applied to your final quote" }
    # Added 2026-10-19 (Google asked for a 6th). Price must match business.ts monthly-maintenance.
    - { text: "Monthly Maintenance", url: /maintenance-plans, line1: "Exterior and interior wash monthly", line2: "Priority booking, $150 a month" }
  # Added only once a business phone number exists (NEXT_PUBLIC_CONTACT_PHONE). null = no call asset.
  call:
    phone: "904-649-0739"
    country_code: US
